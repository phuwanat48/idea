function saveId(id){const x=ideas.find(z=>z.id===id);if(x&&view==='edit'&&cur===id&&!who(x)){setSync('● ยังไม่บันทึก: เลือกผู้เสนอก่อน','var(--color-accent)');return}drafts.delete(id);clearTimeout(dirty.get(id));setSync('กำลังบันทึก…');dirty.set(id,setTimeout(()=>push(id),600))}
function save(){const i=cur_();if(i)saveId(i.id)}
async function push(id){
  const i=ideas.find(x=>x.id===id);dirty.delete(id);if(!i)return;
  const{id:_,...d}=i;
  const{error}=await SB.from('ideas').upsert({id,data:d,updated_at:new Date().toISOString()});

function refresh(){const m={home:renderHome,cmp:renderCmp,ppl:renderPeople,person:renderPerson};view==='edit'?(cur_()?renderEdit():show(backTo)):m[view]()}
function listen(){
  SB.channel('ideas-live').on('postgres_changes',{event:'*',schema:'public',table:'ideas'},p=>{
    if(p.eventType==='DELETE'){const id=p.old.id;ideas=ideas.filter(x=>x.id!==id);sel.delete(id);if(view==='edit'&&cur===id){cur=null;show('home')}else refresh();return}
    const n=row2idea(p.new),k=ideas.findIndex(x=>x.id===n.id);
    if(dirty.has(n.id))return;
    if(k>=0&&norm(ideas[k])===norm(n))return;
    const a=document.activeElement;
    if(view==='edit'&&cur===n.id&&a&&$('#main').contains(a)&&/INPUT|TEXTAREA|BUTTON/.test(a.tagName))return;
    if(k>=0)ideas[k]=n;else{ideas.push(n);ideas.sort((x,y)=>y.id-x.id)}
    refresh();
  }).subscribe(st=>{if(st==='SUBSCRIBED')setSync('● ซิงก์แล้ว',OK);else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT')setSync('● ออฟไลน์','var(--color-accent)')});
}

function fmtDate(v){const m=String(v||'').match(/^(\d{4})-(\d\d)-(\d\d)$/);return m?m[3]+'/'+m[2]+'/'+m[1]:(v||'')}

setInterval(()=>{if(!bnHover&&!bnOff&&view==='home'&&!matchMedia('(prefers-reduced-motion:reduce)').matches)bnGo(bn+1)},5500);
const PRESET=['web','app','security','data'];
let tgOpen=false,tagF=null,qry='',sortBy='new',vmode='grid',backTo='home',pidx=0;
function normTag(r){return String(r||'').trim().replace(/^#+/,'').replace(/\s+/g,'-').toLowerCase().slice(0,24)}
function allTags(){const s=new Set(PRESET);ideas.forEach(i=>(i.tags||[]).forEach(t=>s.add(t)));return[...PRESET,...[...s].filter(t=>!PRESET.includes(t)).sort()]}
function visible(){return ideas.filter(i=>(!tagF||(i.tags||[]).includes(tagF))&&(!qry||[i.name,i.desc,i.proposer,i.users,...(i.tags||[]).map(t=>'#'+t)].join(' ').toLowerCase().includes(qry)))}
function tagHtml(i){
  i.tags=i.tags||[];
  const sel_=i.tags.map(t=>`<span class="tag">#${esc(t)}<button type="button" data-tgdel="${esc(t)}" aria-label="ลบแท็ก ${esc(t)}">×</button></span>`).join('');
  const pop=tgOpen?`<div class="tgpop"><div class="tgl">${allTags().map(t=>`<label class="tgo"><input type="checkbox" data-tgck="${esc(t)}" ${i.tags.includes(t)?'checked':''}> #${esc(t)}</label>`).join('')}</div><div class="row"><input type="text" id="tgnew" placeholder="สร้างแท็กใหม่ เช่น iot, game" maxlength="24" autocomplete="off"><button type="button" class="btn sm" data-tgadd>เพิ่ม</button></div><button type="button" class="btn ghost sm" data-tgclose>เสร็จสิ้น</button></div>`:'';
  return sel_+`<button type="button" class="tagadd" data-tgopen>${tgOpen?'ปิด':'+ เพิ่มแท็ก'}</button>`+pop;
}
function renderTags(){const e=$('#tg'),i=cur_();if(e&&i)e.innerHTML=tagHtml(i)}
function toggleTag(t,on){const i=cur_();if(!i)return;i.tags=i.tags||[];const h=i.tags.includes(t);if(on&&!h)i.tags.push(t);if(!on&&h)i.tags=i.tags.filter(x=>x!==t);save();renderTags()}
function addTag(raw){const t=normTag(raw),i=cur_();if(!i)return;if(t)toggleTag(t,true);else renderTags();const n=$('#tgnew');if(n)n.focus()}
function tagBar(){
  const c={};ideas.forEach(i=>(i.tags||[]).forEach(t=>c[t]=(c[t]||0)+1));
  const k=Object.keys(c).sort();if(!k.length)return'';
  return`<div class="tgf"><button class="tgc ${tagF?'':'on'}" data-tgf="">ทั้งหมด <small>${ideas.length}</small></button>${k.map(t=>`<button class="tgc ${tagF===t?'on':''}" data-tgf="${esc(t)}">#${esc(t)} <small>${c[t]}</small></button>`).join('')}</div>`;
}
document.addEventListener('keydown',e=>{if(e.target.id==='tgnew'&&e.key==='Enter'){e.preventDefault();addTag(e.target.value)}});
const PILL=['Top Pick','สำรอง','ปรับขอบเขต','ตกไป'];
function stats(){
  const n=ideas.length,pass=ideas.filter(i=>total(i)>=15).length,top=ideas.filter(i=>i.status===0).length,np=new Set(ideas.map(i=>who(i)||(i.proposer||'').trim()).filter(Boolean)).size;
  const best=[...ideas].sort((a,b)=>total(b)-total(a)).slice(0,6);
  const c=(v,l)=>`<div class="st"><b data-count="${v}">${v}</b><small>${l}</small></div>`;
  const b0=best[0],sc=b0?total(b0):0;
  const meta=b0?`<span class="w-name" title="${esc(b0.name||'')}">${esc(b0.name||'ไม่มีชื่อ')}</span><span class="mb" aria-hidden="true">${best.map(i=>`<i style="height:${Math.max(10,total(i)*5)}%"></i>`).join('')}</span>`:'<span class="w-name">ยังไม่มีไอเดียในระบบ</span>';
  return`<div class="sts">${c(n,'ไอเดียทั้งหมด')}${c(np,'ผู้เสนอไอเดีย')}${c(pass,'ผ่านเกณฑ์ 15 คะแนน')}${c(top,'ตัวเลือกหลัก')}<div class="st w"><div class="w-meta"><span class="w-k">คะแนนไอเดียสูงสุด</span>${meta}</div><div class="score-ring" role="img" aria-label="คะแนนไอเดียสูงสุด ${sc} จาก 20"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="ring-bg" cx="60" cy="60" r="52"></circle><circle class="ring-fg" cx="60" cy="60" r="52" data-ring="${sc}" stroke-dasharray="326.7" stroke-dashoffset="${(326.7*(1-Math.min(1,sc/20))).toFixed(1)}"></circle></svg><span class="ring-num" aria-hidden="true"><b data-count="${sc}">${sc}</b><i>/20</i></span></div></div></div>`;
}
function card(i){
  const tg=(i.tags||[]).map(t=>`<em>#${esc(t)}</em>`).join(''),nm=who(i)||(i.proposer||'').trim();
  return`<article class="cd" data-cd="${i.id}"><div class="cvb"><span class="reading">${total(i)}<span>/20</span></span><span class="pl s${i.status}">${i.status>=0?PILL[i.status]:'ยังไม่สรุป'}</span><input type="checkbox" class="ck" data-ck="${i.id}" ${sel.has(i.id)?'checked':''} aria-labelledby="cn-${i.id}"><button class="fv ${i.fav?'on':''}" data-fav="${i.id}" aria-pressed="${!!i.fav}" aria-label="ติดดาว">${i.fav?'★':'☆'}</button></div><button class="cb" data-open="${i.id}">${tg?`<span class="tgs">${tg}</span>`:''}<b id="cn-${i.id}">${esc(i.name)||'ไอเดียที่ยังไม่ตั้งชื่อ'}</b><span class="cdd">${esc(i.desc||i.users||'')}</span><span class="cf"><span class="av">${esc((nm[0]||'?').toUpperCase())}</span><span class="cn">${esc(nm)||'ไม่ระบุผู้เสนอ'}<small>${fmtDate(isoDate(i.date))}</small></span></span></button></article>`;
}
function renderHome(){
  if(tagF&&!ideas.some(i=>(i.tags||[]).includes(tagF)))tagF=null;
  const L=visible().slice();
  L.sort({new:(a,b)=>b.id-a.id,score:(a,b)=>total(b)-total(a),name:(a,b)=>(a.name||'~').localeCompare(b.name||'~','th'),fav:(a,b)=>(!!b.fav-!!a.fav)||(b.id-a.id)}[sortBy]);
  const ctl=`<div class="ctl"><button class="vm ${vmode==='grid'?'on':''}" data-vm="grid" aria-label="มุมมองการ์ด">▦</button><button class="vm ${vmode==='list'?'on':''}" data-vm="list" aria-label="มุมมองรายการ">☰</button><label class="srl" for="sort">เรียง</label><select id="sort" data-sort>${[['new','ล่าสุดก่อน'],['score','คะแนนสูงสุด'],['fav','ติดดาวก่อน'],['name','ชื่อ ก–ฮ']].map(o=>`<option value="${o[0]}" ${sortBy===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>`;
  const bar=L.length?`<div class="bar"><label style="margin:0;display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="all" ${L.every(x=>sel.has(x.id))?'checked':''}> เลือกทั้งหมด</label><button class="btn ghost sm" id="delsel" ${sel.size?'':'disabled'}>ลบที่เลือก (${sel.size})</button></div>`:'';
  $('#main').innerHTML=bannerHtml()+stats()+`<div class="frow" id="tags">${tagBar()}${ctl}</div><div class="hd" id="list"><h2>ไอเดียทั้งหมด (${L.length})</h2>${bar}</div>`+(L.length?`<div class="cds ${vmode}">${L.map(card).join('')}</div>`:`<div class="empty">${ideas.length?'ไม่พบไอเดียที่ตรงกับการค้นหา':'ยังไม่มีไอเดีย<br>กดปุ่ม + มุมขวาล่างเพื่อเริ่มบันทึก'}</div>`);
}
const PEOPLE=['Phuwanat Kunwaraapiphat','Wisawa Junhom'];
function who(i){const p=(i.proposer||'').trim().toLowerCase();if(!p)return'';return PEOPLE.find(n=>n.toLowerCase()===p)||PEOPLE.find(n=>n.toLowerCase().startsWith(p.split(/\s+/)[0]))||''}
function myName(){try{const v=localStorage.getItem('me');return PEOPLE.includes(v)?v:''}catch(e){return''}}
function proposerSelect(i){
  const w=who(i),old=(i.proposer||'').trim();
  return`<div><label for="f-proposer">ผู้เสนอไอเดีย <span style="color:var(--bad)">*</span></label><select id="f-proposer" class="f" data-k="proposer"><option value="">— เลือกผู้เสนอไอเดีย —</option>${PEOPLE.map(n=>`<option value="${n}" ${w===n?'selected':''}>${n}</option>`).join('')}${old&&!w?`<option value="${esc(old)}" selected>${esc(old)}</option>`:''}</select><small class="reqmsg">กรุณาเลือกผู้เสนอไอเดีย</small></div>`;
}
function renderPeople(){
  const none=ideas.filter(i=>!who(i)).length;
  $('#main').innerHTML=`<div class="hd"><h2>แยกตามผู้เสนอไอเดีย</h2></div><p class="sub2">เลือกผู้เสนอเพื่อดูเฉพาะไอเดียของคนนั้น</p><div class="ppl">${PEOPLE.map((n,k)=>{
    const L=ideas.filter(i=>who(i)===n),pass=L.filter(i=>total(i)>=15).length,top=L.filter(i=>i.status===0).length;
    return`<button class="pc" data-person="${k}"><span class="pav">${n[0]}</span><b>${n}</b><span class="pn">${L.length}</span><small>ไอเดียที่เสนอ</small><span class="pst"><span><b>${pass}</b><small>ผ่านเกณฑ์</small></span><span><b>${top}</b><small>ตัวเลือกหลัก</small></span></span></button>`}).join('')}</div>${none?`<p class="sub2" style="margin-top:16px">มี ${none} ไอเดียที่ยังไม่ระบุผู้เสนอ ดูได้ที่หน้าหลัก</p>`:''}`;
}
function renderPerson(){
  const n=PEOPLE[pidx],L=ideas.filter(i=>who(i)===n).sort((a,b)=>b.id-a.id);
  $('#main').innerHTML=`<button class="btn ghost sm back" data-ppl>กลับ</button><div class="pbar"><span class="pav">${n[0]}</span><div><b style="font-size:20px">${n}</b><br><small style="color:var(--mu)">${L.length} ไอเดีย</small></div></div>`+(L.length?`<div class="cds nosel ${vmode}">${L.map(card).join('')}</div>`:`<div class="empty">${n} ยังไม่มีไอเดีย<br>กดปุ่ม + มุมขวาล่างเพื่อเพิ่ม (เลือกผู้เสนอเป็นชื่อนี้)</div>`);
}
function leave(next){
  if(view!=='edit'){next();return}
  const i=cur_();
  if(i&&!who(i)){pendingNext=next;$('#warn').showModal();return}
  if(i&&drafts.has(i.id)){ideas=ideas.filter(x=>x!==i);drafts.delete(i.id);cur=null}
  next();
}
function discardEdit(i){
  clearTimeout(dirty.get(i.id));dirty.delete(i.id);
  if(drafts.has(i.id)){ideas=ideas.filter(x=>x!==i);drafts.delete(i.id)}
  else if(editSnap){const k=ideas.findIndex(x=>x.id===i.id);if(k>=0)ideas[k]=JSON.parse(editSnap)}
  cur=null;setSync('● ซิงก์แล้ว',OK);
}
function stayEdit(){
  $('#warn').close();pendingNext=null;
  const s=document.querySelector('select[data-k="proposer"]');
  if(s){s.classList.add('bad');s.scrollIntoView({behavior:'smooth',block:'center'});s.focus()}
}
window.addEventListener('beforeunload',e=>{const i=view==='edit'&&cur_();if(i&&!who(i)){e.preventDefault();e.returnValue=''}});
function show(v){view=v;document.body.classList.toggle('editing',v==='edit');const hv=v==='edit'?backTo:v;$('#t-home').classList.toggle('on',hv==='home');$('#t-cmp').classList.toggle('on',hv==='cmp');$('#t-ppl').classList.toggle('on',hv==='ppl'||hv==='person');$('#main').style.display='';v==='home'?renderHome():v==='edit'?renderEdit():v==='ppl'?renderPeople():v==='person'?renderPerson():renderCmp()}
function md(i){
  const L=a=>a.filter(x=>x.trim());const n=(a,p)=>L(a).map((x,k)=>`  ${k+1}. ${x}`).join('\n')||'  1. -';
  const ck=ST.map((s,k)=>`\`[${i.status===k?'x':' '}] ${s}\``).join(' | ');

* **วันที่บันทึก:** ${fmtDate(i.date)}
* **คำอธิบายโครงการโดยสรุป:** ${i.desc||''}

### 1. การวิเคราะห์ผู้ใช้และปัญหา (User-Centered Analysis)

  * ${i.users}

${n(i.pains)}

${n(i.features)}

| :--- | :---: | :--- |
${CR.map((c,k)=>`| **${k+1}. ${c[0]}** | ${i.scores[k]||'-'} | ${i.reasons[k].replace(/\|/g,'/')} |`).join('\n')}
| **คะแนนรวม (Total Score):** | **${total(i)}/20** | |

  * ${i.risks}
* **คำถามที่ต้องนำไปปรึกษาอาจารย์ที่ปรึกษา (Questions for Advisor):**
${n(i.questions)}
* **สรุปสถานะไอเดีย:** ${ck}
`}
document.addEventListener('input',e=>{
  if(e.target.id==='q'){qry=e.target.value.trim().toLowerCase();view==='edit'?leave(()=>show('home')):view==='home'?renderHome():show('home');return}
  const i=cur_(),t=e.target;if(!i)return;
  if(t.dataset.k){i[t.dataset.k]=t.value;if(t.dataset.k==='proposer'){if(t.value)t.classList.remove('bad');if(PEOPLE.includes(t.value)){try{localStorage.setItem('me',t.value)}catch(_){}}}}
  else if(t.dataset.l)i[t.dataset.l][+t.dataset.i]=t.value;
  else if(t.dataset.r)i.reasons[+t.dataset.r]=t.value;
  else return;
  save();if(t.dataset.k==='name')upd();
});
document.addEventListener('click',e=>{
  const b=e.target.closest('button,tr.cl');if(!b)return;const i=cur_(),d=b.dataset;
  if(d.bnoff!==undefined){bnOff=true;try{localStorage.setItem('bn-auto','0')}catch(_){}renderHome();return}
  if(d.bnon!==undefined){bnOff=false;try{localStorage.setItem('bn-auto','1')}catch(_){}renderHome();return}
  if(d.bn!==undefined){bnGo(bn+ +d.bn);return}
  if(d.bng!==undefined){bnGo(+d.bng);return}
  if(d.bnnew!==undefined){$('#new').click();return}
  if(d.tgf!==undefined){tagF=d.tgf||null;renderHome();return}
  if(d.tgopen!==undefined){tgOpen=!tgOpen;renderTags();if(tgOpen){const n=$('#tgnew');if(n&&matchMedia('(pointer:fine)').matches)n.focus()}return}
  if(d.tgclose!==undefined){tgOpen=false;renderTags();return}
  if(d.tgdel!==undefined){toggleTag(d.tgdel,false);return}
  if(d.tgadd!==undefined){addTag($('#tgnew').value);return}
  if(d.fav!==undefined){const x=ideas.find(z=>z.id===+d.fav);if(x){x.fav=!x.fav;saveId(x.id);refresh()}return}
  if(d.vm!==undefined){vmode=d.vm;renderHome();return}
  if(d.hclose!==undefined){$('#howto').close();return}
  if(d.go!==undefined){
    if(d.go==='how'){openHow();return}
    if(view==='edit'){const g=d.go;leave(()=>{show('home');const t=document.getElementById(g);if(t)t.scrollIntoView({block:'start'})});return}
    if(view!=='home')show('home');
    const e=document.getElementById(d.go);
    if(e){e.scrollIntoView({behavior:'smooth',block:'start'});flash(e)}
    if(d.go==='tags'&&!document.querySelector('#tags .tgc'))toast('ยังไม่มีแท็ก — เพิ่มแท็กได้ในหน้ากรอกรายละเอียดของไอเดีย (ส่วนข้อมูลเบื้องต้น)');
    return}
  if(d.wok!==undefined){$('#warn').close();const w=cur_();if(w)discardEdit(w);const nx=pendingNext;pendingNext=null;if(nx)nx();return}
  if(d.wcancel!==undefined){stayEdit();return}
  if(d.home){leave(()=>show(backTo));return}
  if(d.open){cur=+d.open;{const o=ideas.find(x=>x.id===cur);editSnap=o?JSON.stringify(o):null}backTo=view==='cmp'?'cmp':view==='person'?'person':'home';show('edit');return}
  if(d.person!==undefined){pidx=+d.person;show('person');return}
  if(d.ppl!==undefined){show('ppl');return}
  if(b.id==='delsel'){if(sel.size&&confirm('ลบ '+sel.size+' ไอเดียที่เลือกถาวร?')){const ids=[...sel];ideas=ideas.filter(x=>!sel.has(x.id));removeIds(ids);sel.clear();renderHome()}return}
  if(!i)return;
  if(d.sc!==undefined){const n=+d.sc,v=+d.v;i.scores[n]=i.scores[n]===v?0:v;save();b.parentNode.querySelectorAll('button').forEach(x=>{const on=i.scores[n]===+x.dataset.v;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on)});upd()}
  else if(d.st!==undefined){i.status=i.status===+d.st?-1:+d.st;save();b.parentNode.querySelectorAll('button').forEach(x=>{const on=i.status===+x.dataset.st;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on)});upd()}
  else if(d.add){i[d.add].push('');save();renderEdit();const r=document.querySelectorAll(`[data-l="${d.add}"]`);r[r.length-1].focus()}
  else if(d.del){if(i[d.del].length>1)i[d.del].splice(+d.i,1);else i[d.del]=[''];save();renderEdit()}
  else if(b.id==='del'){if(confirm('ลบไอเดียนี้ถาวร?')){ideas=ideas.filter(x=>x!==i);removeIds([i.id]);drafts.delete(i.id);sel.clear();cur=null;show(backTo)}}
  else if(b.id==='dup'){const c=JSON.parse(JSON.stringify(i));c.id=Date.now();c.name+=' (สำเนา)';drafts.add(c.id);editSnap=null;ideas.unshift(c);cur=c.id;save();renderEdit()}
  else if(b.id==='exp'){$('#md').value=md(i);$('#dlg').showModal()}
});
document.addEventListener('change',e=>{const t=e.target;if(t.type==='date'&&t.dataset.k){const i=cur_();if(i){if(!t.value){t.value=todayISO();i.date=t.value;save()}t.closest('.dt').querySelector('.dtv').textContent=fmtDate(t.value)}return}if(t.dataset.sort!==undefined){sortBy=t.value;renderHome();return}if(t.dataset.tgck!==undefined){toggleTag(t.dataset.tgck,t.checked);return}if(t.dataset.ck){const id=+t.dataset.ck;t.checked?sel.add(id):sel.delete(id);renderHome()}else if(t.id==='all'){sel.clear();if(t.checked)visible().forEach(x=>sel.add(x.id));renderHome()}});
document.addEventListener('click',e=>{const t=e.target;if(t.type==='date'&&t.showPicker){try{t.showPicker()}catch(_){}}});
function setThemeMeta(n){const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=n==='dark'?'#15191c':'#faf8f4'}
setThemeMeta(document.documentElement.dataset.theme);

<script type="module">
/* ------------------------------------------------------------------
   Motion layer — hero light-lines canvas, staggered cards, counters, ring.
   Everything degrades to a static, correct page (no hidden content).
   ------------------------------------------------------------------ */
import { animate, stagger } from "https://cdn.jsdelivr.net/npm/motion@12/+esm";

const reduceMQ = window.matchMedia('(prefers-reduced-motion: reduce)');
const mainEl = document.getElementById('main');
const EASE = [0.16, 1, 0.3, 1];

/* ---------------- hero: thin white lines, slow rotation ---------------- */
let cv = null, ctx = null, host = null, bnEl = null;
let raf = 0, running = false, phase = 0, tPrev = 0;
let w = 0, h = 0, threads = 0, ro = null, io = null, fadeRaf = 0;
let lineRGB = '255,255,255';
const STROKES = [0.10, 0.055, 0.075, 0.04, 0.09];

function measure() {
  if (!cv || !ctx) return;
  const r = cv.getBoundingClientRect();
  w = Math.max(1, Math.round(r.width));
  h = Math.max(1, Math.round(r.height));
  const dpr = Math.min(window.devicePixelRatio || 1, w < 640 ? 1.5 : 2);
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  threads = w < 560 ? 52 : w < 900 ? 84 : 124;
}

function paint(t) {
  if (!ctx) return;
  ctx.clearRect(0, 0, w, h);
  ctx.globalCompositeOperation = blend;
  /* the apex sits above the frame: what shows is the draped skirt of lines */
  const cx = w * 0.5, top = -h * 0.3, floor = h * 0.88;
  const R = Math.max(w * 1.12, h * 1.2);
  const step = 1 / 18;
  for (let j = 0; j < threads; j++) {
    const a0 = (j / threads) * Math.PI * 2 + t;
    ctx.beginPath();
    for (let s = 0; s <= 1.0001; s += step) {
      const rad = 5 + Math.pow(s, 2.6) * R;
      const a = a0 + s * 2.6;
      const x = cx + Math.cos(a) * rad;
      const y = top + s * (floor - top) + Math.sin(a) * rad * 0.06;
      if (s === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = 'rgba(' + lineRGB + ',' + STROKES[j % STROKES.length] + ')';
    ctx.lineWidth = 0.7;
    ctx.stroke();
  }
  let i = 0;
  for (let s = 0.7; s <= 1.001; s += 0.15) {
    const rad = 5 + Math.pow(s, 2.6) * R;
    const y = top + s * (floor - top);
    ctx.beginPath();
    ctx.ellipse(cx, y, rad, rad * 0.13, 0, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(' + lineRGB + ',' + Math.max(0.01, 0.038 - i * 0.004) + ')';
    ctx.lineWidth = 0.6;
    ctx.stroke();
    i++;
  }
  ctx.globalCompositeOperation = 'source-over';
}

function loop(now) {
  if (!running) return;
  const dt = Math.min(64, Math.max(0, now - tPrev));
  tPrev = now;
  phase += dt * 0.00006;
  paint(phase);
  raf = requestAnimationFrame(loop);
}

let blend = 'lighter';

function readLineColor() {
  lineRGB = getComputedStyle(document.documentElement).getPropertyValue('--fx-line').trim() || '255,255,255';
  const lead = parseInt(lineRGB.split(',')[0], 10);
  /* light ink on paper: additive blending would cancel black lines out */
  blend = isNaN(lead) || lead > 128 ? 'lighter' : 'source-over';
}

function startFX() {
  if (!cv || !ctx) return;
  if (reduceMQ.matches) { paint(0.9); return; }
  if (running || w < 2) return;
  running = true;
  tPrev = performance.now();
  raf = requestAnimationFrame(loop);
}

function stopFX() {
  running = false;
  if (raf) cancelAnimationFrame(raf);
  raf = 0;
}

function applyFade() {
  if (!bnEl || !host) return;
  const r = bnEl.getBoundingClientRect();
  const p = Math.min(1, Math.max(0, -r.top / Math.max(1, r.height)));
  host.style.opacity = (1 - p).toFixed(3);
  host.style.transform = reduceMQ.matches ? 'none' : 'translate3d(0,' + (-p * 32).toFixed(1) + 'px,0)';
}

function onScroll() {
  if (fadeRaf) return;
  fadeRaf = requestAnimationFrame(function () { fadeRaf = 0; applyFade(); });
}
window.addEventListener('scroll', onScroll, { passive: true });

/* ---------------- hero entrance, once per visit ---------------- */
let hadBn = false, heroAt = 0;

function heroEntrance(bn) {
  if (reduceMQ.matches) return;
  const slide = bn.querySelector('.bns.on') || bn.querySelector('.bns');
  if (!slide) return;
  const bits = [slide.querySelector('h2'), slide.querySelector('p'), slide.querySelector('.bnc')].filter(Boolean);
  if (!bits.length) return;
  bits.forEach(function (el) { el.style.opacity = '0'; });
  const clear = function () { bits.forEach(function (el) { el.style.opacity = ''; el.style.transform = ''; }); };
  const ctrl = animate(bits, { opacity: [0, 1], y: [22, 0] },
    { duration: 0.75, delay: stagger(0.1), easing: EASE, onComplete: clear });
  /* an occluded tab can freeze mid-animation: drop the effect and settle on the final frame */
  setTimeout(function () {
    clear();
    if (ctrl && ctrl.cancel) { try { ctrl.cancel(); } catch (e) {} }
  }, 2400);
}

function mountHero() {
  const bn = document.querySelector('#bn');
  const holder = bn && bn.querySelector('.hero-fx');
  if (!bn || !holder) {
    stopFX(); host = null; bnEl = null;
    return null;
  }
  if (!cv) {
    cv = document.createElement('canvas');
    cv.className = 'hero-canvas';
    cv.setAttribute('aria-hidden', 'true');
  }
  if (host !== holder) {
    if (cv.parentNode !== holder) holder.appendChild(cv);
    ctx = cv.getContext('2d');
    host = holder; bnEl = bn;
    readLineColor();
    measure();
    if (ro) ro.disconnect();
    ro = new ResizeObserver(measure);
    ro.observe(holder);
    if (io) io.disconnect();
    io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) { if (en.isIntersecting) startFX(); else stopFX(); });
    }, { threshold: 0.02 });
    io.observe(bn);
    startFX();
  }
  bnEl = bn;
  applyFade();
  return bn;
}

/* ---------------- idea cards: lift in one at a time ---------------- */
const seenCards = new Set();

function revealCards() {
  const els = Array.prototype.slice.call(document.querySelectorAll('#main .cd'));
  if (!els.length) return;
  const fresh = els.filter(function (el) { return el.dataset.cd && !seenCards.has(el.dataset.cd); });
  els.forEach(function (el) { seenCards.add(el.dataset.cd); });
  if (!fresh.length || reduceMQ.matches) return;
  fresh.forEach(function (el) { el.style.opacity = '0'; el.style.willChange = 'transform, opacity'; });
  const clear = function (list) {
    list.forEach(function (el) { el.style.opacity = ''; el.style.transform = ''; el.style.willChange = ''; });
  };
  const ctrl = animate(fresh, { opacity: [0, 1], y: [24, 0] },
    { duration: 0.55, delay: stagger(0.055), easing: EASE, onComplete: function () { clear(fresh); } });
  setTimeout(function () {
    clear(fresh);
    if (ctrl && ctrl.cancel) { try { ctrl.cancel(); } catch (e) {} }
  }, 2400);
}

/* ---------------- figures: count up + score ring ---------------- */
let statSig = '';

function syncStats() {
  const nums = Array.prototype.slice.call(document.querySelectorAll('[data-count]'));
  const ring = document.querySelector('.ring-fg');
  const len = 2 * Math.PI * 52;
  const p = ring ? Math.max(0, Math.min(1, (Number(ring.dataset.ring) || 0) / 20)) : 0;
  const rest = String(len * (1 - p));
  if (ring) ring.style.strokeDasharray = String(len);

  if (!nums.length) { statSig = ''; if (ring) ring.style.strokeDashoffset = rest; return; }

  const sig = nums.map(function (el) { return el.dataset.count; }).join(',');
  const fresh = sig !== statSig;
  statSig = sig;

  /* the block is re-rendered often: keep the ring correct even when nothing animates */
  if (!fresh) { if (ring) ring.style.strokeDashoffset = rest; return; }

  nums.forEach(function (el) {
    const to = Number(el.dataset.count) || 0;
    if (reduceMQ.matches || to === 0) { el.textContent = String(to); return; }
    el.textContent = '0';
    animate(0, to, {
      duration: 0.9, easing: EASE,
      onUpdate: function (v) { el.textContent = String(Math.round(v)); }
    });
  });

  /* a tab that never paints must still land on the real numbers */
  setTimeout(function () {
    document.querySelectorAll('[data-count]').forEach(function (el) {
      const v = el.dataset.count;
      if (el.textContent !== v) el.textContent = v;
    });
    if (ring) ring.style.strokeDashoffset = rest;
  }, 1400);

  if (!ring) return;
  if (reduceMQ.matches || p === 0) { ring.style.strokeDashoffset = rest; return; }
  ring.style.strokeDashoffset = String(len);
  animate(len, len * (1 - p), {
    duration: 1.1, easing: EASE,
    onUpdate: function (v) { ring.style.strokeDashoffset = String(v); }
  });
}

/* ---------------- sync with every re-render ---------------- */
let queued = false;

function sync() {
  queued = false;
  let bn = null;
  try { bn = mountHero(); } catch (e) { console.error('[fx] hero', e); }
  try { if (bn && !hadBn) { heroAt = performance.now(); heroEntrance(bn); } }
  catch (e) { console.error('[fx] hero entrance', e); }
  hadBn = !!bn;
  try { revealCards(); } catch (e) { console.error('[fx] cards', e); }
  try { syncStats(); } catch (e) { console.error('[fx] stats', e); }
}

/* a microtask, not rAF: a hidden or occluded tab must still build the layer */
function schedule() {
  if (queued) return;
  queued = true;
  Promise.resolve().then(sync);
}

const mo = new MutationObserver(schedule);
mo.observe(mainEl, { childList: true, subtree: true });

/* the theme dial repaints the light lines in the new ink */
new MutationObserver(function () {
  readLineColor();
  if (!running) paint(phase);
}).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

document.addEventListener('visibilitychange', function () {
  if (document.hidden) stopFX(); else if (host) startFX();
});
if (reduceMQ.addEventListener) reduceMQ.addEventListener('change', sync);
sync();
</script>
</body>
