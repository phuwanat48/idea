<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capstone Idea Log</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceff3;--sf:#fff;--ink:#16213a;--mu:#64708a;--ln:#d5dbe5;--ac:#0e6e6e;--acs:#d9efee;--hi:#f0b429;--ok:#157347;--bad:#b3261e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1524;--sf:#18203a;--ink:#e8ecf5;--mu:#98a3bd;--ln:#2c3656;--ac:#4cc3bd;--acs:#16403f;--hi:#f0b429;--ok:#5ad08f;--bad:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1524;--sf:#18203a;--ink:#e8ecf5;--mu:#98a3bd;--ln:#2c3656;--ac:#4cc3bd;--acs:#16403f;--hi:#f0b429;--ok:#5ad08f;--bad:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 "IBM Plex Sans Thai",system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--ink);color:var(--bg);flex-wrap:wrap}
header h1{margin:0;font-size:18px;font-weight:700}
.tabs{display:flex;gap:4px}
.tabs button{background:transparent;border:0;color:inherit;padding:6px 14px;border-radius:6px;cursor:pointer;opacity:.7}
.tabs button.on{background:var(--hi);color:#16213a;opacity:1;font-weight:500}
.btn{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:500}
:root[data-theme="dark"] .btn,:root:not([data-theme="light"]) .btn{color:#0b1220}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ln)}
.btn.sm{padding:3px 10px;font-size:13px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
main{max-width:900px;margin:0 auto;padding:20px}.gh{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.gh .it{min-height:84px;align-items:flex-start}.back{margin-bottom:14px}
:root:root .btn.ghost{color:var(--ink);background:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}
#delsel:not(:disabled){color:var(--bad);border-color:var(--bad)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.hd .bar{align-items:center}
.cw{display:flex;align-items:flex-start;gap:8px}.cw .it{flex:1}.ck,#all{width:20px;height:20px;accent-color:var(--ac);cursor:pointer}.ck{margin-top:12px}.hd{margin-bottom:14px}.hd h2{margin:0;font-size:20px}
aside{display:flex;flex-direction:column;gap:8px;align-content:start}
.it{background:var(--sf);border:1px solid var(--ln);border-left:5px solid var(--ln);border-radius:6px;padding:10px 12px;cursor:pointer;text-align:left;display:flex;justify-content:space-between;gap:8px;align-items:center;width:100%}
.it.on{border-color:var(--ac);border-left-color:var(--ac);background:var(--acs)}
.it b{display:block;font-weight:500}.it small{color:var(--mu)}
.it.s0{border-left-color:var(--hi)}.it.s1{border-left-color:var(--ac)}.it.s2{border-left-color:var(--mu)}.it.s3{border-left-color:var(--bad)}
.pt{font-weight:700;font-size:18px;white-space:nowrap}
.pt.g{color:var(--ok)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:20px 22px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:17px}
.card .sub{color:var(--mu);font-size:13px;margin:0 0 14px}
label{display:block;font-weight:500;margin:12px 0 4px;font-size:14px}
label span{color:var(--mu);font-weight:400}
input[type=text],textarea{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:8px 10px}
textarea{min-height:68px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.row{display:flex;gap:6px;margin-bottom:6px}
.row .x{background:transparent;border:1px solid var(--ln);border-radius:6px;width:36px;cursor:pointer;color:var(--mu)}
.sc{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:12px 0;border-top:1px solid var(--ln)}
.sc:first-of-type{border-top:0}
.sc .q{font-weight:500}.sc .q small{display:block;color:var(--mu);font-weight:400}
.nums{display:flex;gap:4px}
.nums button{width:36px;height:36px;border:1px solid var(--ln);background:var(--bg);border-radius:6px;cursor:pointer;font-weight:500}
.nums button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sc input{grid-column:1/-1}
.total{display:flex;justify-content:space-between;align-items:center;background:var(--acs);border-radius:8px;padding:12px 16px;margin-top:8px}
.total b{font-size:26px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1px solid var(--ln);background:var(--bg);border-radius:20px;padding:6px 14px;cursor:pointer}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
table{width:100%;border-collapse:collapse;background:var(--sf);border-radius:10px;overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--ln)}
th{font-size:13px;color:var(--mu);font-weight:500}
tr.cl{cursor:pointer}tr.cl:hover td{background:var(--acs)}
.wrap{overflow-x:auto}
dialog{border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--ink);width:min(680px,92vw);padding:18px}
dialog textarea{min-height:320px;font:13px/1.5 ui-monospace,monospace}
.empty{padding:40px 16px;text-align:center;color:var(--mu)}
@media(max-width:820px){main{padding:14px}.g2,.g3{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>บันทึกไอเดียโปรเจกต์จบ</h1>
  <div class="tabs"><button id="t-home" class="on">หน้าแรก</button><button id="t-cmp">เปรียบเทียบ</button></div>
  <button class="btn" id="new" style="background:var(--hi);color:#16213a">+ ไอเดียใหม่</button>
</header>
<main id="main"></main>
<dialog id="dlg"><b>Markdown ตามแบบฟอร์ม</b><textarea id="md" readonly></textarea>
<div class="bar" style="margin-top:10px"><button class="btn ghost" id="close">ปิด</button><button class="btn" id="copy">คัดลอก</button></div></dialog>
<script>
const LK='capstone-ideas-v1',ST=['ตัวเลือกหลัก (Top Pick)','ตัวเลือกสำรอง','ปรับแก้ขอบเขต','ตกไป'];
const CR=[['ความสนใจของทีม','ทั้งสองคนตื่นเต้นและอยากทำระบบนี้มากแค่ไหน'],['ความเป็นไปได้ทางเทคนิค','มีทักษะพร้อม หรือศึกษาเพิ่มได้ทัน'],['ความชัดเจนของผู้ใช้จริง','ระบุกลุ่มผู้ใช้ได้ และหาคนมาทดสอบได้จริง'],['ความเหมาะสมของขอบเขต','ไม่ใหญ่จนทำไม่ทัน ไม่เล็กเกินไปสำหรับโปรเจกต์จบ']];
let ideas=[],cur=null,view='edit';const sel=new Set();
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function load(){try{ideas=JSON.parse(localStorage.getItem(LK))||[]}catch(e){ideas=[]}}
function save(){try{localStorage.setItem(LK,JSON.stringify(ideas))}catch(e){}}
function today(){const d=new Date(),p=n=>String(n).padStart(2,'0');return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()}
function blank(){return{id:Date.now(),name:'',proposer:'',date:today(),users:'',pains:[''],solution:'',value:'',features:['','',''],fe:'',be:'',tools:'',m1:'',m2:'',pair:'',scores:[0,0,0,0],reasons:['','','',''],risks:'',questions:[''],status:-1}}
const total=i=>i.scores.reduce((a,b)=>a+b,0);
const cur_=()=>ideas.find(i=>i.id===cur);

function listHtml(){
  if(!ideas.length)return'<div class="empty">ยังไม่มีไอเดีย<br>กด “+ ไอเดียใหม่” เพื่อเริ่มบันทึก</div>';
  return ideas.map(i=>`<button class="it ${i.id===cur?'on':''} s${i.status}" data-open="${i.id}"><span><b>${esc(i.name)||'ไอเดียที่ยังไม่ตั้งชื่อ'}</b><small>${i.status>=0?ST[i.status]:'ยังไม่สรุปสถานะ'}</small></span><span class="pt ${total(i)>=15?'g':''}">${total(i)}</span></button>`).join('');
}
function listField(i,k,label,hint,ph){
  return`<label>${label} <span>${hint||''}</span></label><div data-box="${k}">${i[k].map((v,n)=>`<div class="row"><input type="text" data-l="${k}" data-i="${n}" value="${esc(v)}" placeholder="${ph}"><button class="x" data-del="${k}" data-i="${n}" aria-label="ลบ">×</button></div>`).join('')}</div><button class="btn ghost sm" data-add="${k}">+ เพิ่มรายการ</button>`;
}
function tx(i,k,label,hint,rows){return`<label>${label} <span>${hint||''}</span></label><textarea data-k="${k}" ${rows?`style="min-height:${rows}px"`:''}>${esc(i[k])}</textarea>`}
function ti(i,k,label,hint){return`<div><label>${label} <span>${hint||''}</span></label><input type="text" data-k="${k}" value="${esc(i[k])}"></div>`}

function renderEdit(){
  const i=cur_();
  let f='<div class="empty">เลือกไอเดียทางซ้าย หรือสร้างไอเดียใหม่</div>';
  if(i){f=`
  <div class="card"><h2>ข้อมูลเบื้องต้น</h2><p class="sub">บันทึกอัตโนมัติในเบราว์เซอร์นี้</p>
    ${ti(i,'name','ชื่อไอเดีย / ชื่อโครงการชั่วคราว','')}
    <div class="g2">${ti(i,'proposer','ผู้เสนอไอเดีย','')}${ti(i,'date','วันที่บันทึก','DD/MM/YYYY')}</div></div>
  <div class="card"><h2>1. ผู้ใช้และปัญหา</h2><p class="sub">เริ่มจากคนที่มีปัญหาจริง ก่อนคิดว่าจะทำอะไร</p>
    ${tx(i,'users','กลุ่มผู้ใช้เป้าหมาย','เช่น นักศึกษา, ร้านค้าขนาดเล็ก, ผู้สูงอายุ')}
    ${listField(i,'pains','ปัญหาหลักที่ต้องการแก้ไข','','ปัญหาที่เกิดขึ้นจริง')}
    ${tx(i,'solution','แนวทางแก้ไขด้วยซอฟต์แวร์','ระบบจะช่วยแก้ปัญหาข้างต้นอย่างไร')}
    ${tx(i,'value','คุณค่าที่ผู้ใช้จะได้รับ','')}</div>
  <div class="card"><h2>2. ขอบเขตเทคนิคและการแบ่งงาน 2 คน</h2><p class="sub">ฟีเจอร์สุดท้ายในรายการ ใช้เป็นฟีเจอร์เสริมถ้ามีเวลาเหลือ</p>
    ${listField(i,'features','ฟีเจอร์หลักสำหรับ MVP','','ฟีเจอร์ที่ต้องมี')}
    <div class="g3" style="margin-top:6px">${ti(i,'fe','Frontend','React, Flutter, Vue')}${ti(i,'be','Backend & Database','Node.js, FastAPI, Firebase')}${ti(i,'tools','Tools / AI / Cloud','Git, Docker, AWS')}</div>
    <div class="g2">${ti(i,'m1','สมาชิกคนที่ 1','เช่น Frontend, UI/UX')}${ti(i,'m2','สมาชิกคนที่ 2','เช่น Backend, API')}</div>
    ${ti(i,'pair','งานที่ทำร่วมกัน','เช่น System Architecture, DB Schema')}</div>
  <div class="card"><h2>3. ประเมินความพร้อมของไอเดีย</h2><p class="sub">ประเมินร่วมกัน ให้คะแนน 1–5 ในแต่ละข้อ</p>
    ${CR.map((c,n)=>`<div class="sc"><div class="q">${n+1}. ${c[0]}<small>${c[1]}</small></div><div class="nums">${[1,2,3,4,5].map(v=>`<button data-sc="${n}" data-v="${v}" class="${i.scores[n]===v?'on':''}" aria-label="${v} คะแนน">${v}</button>`).join('')}</div><input type="text" data-r="${n}" value="${esc(i.reasons[n])}" placeholder="เหตุผลประกอบ / ข้อสังเกต"></div>`).join('')}
    <div class="total"><span id="verdict"></span><b id="tot"></b></div></div>
  <div class="card"><h2>4. ความเสี่ยงและเตรียมปรึกษาอาจารย์</h2><p class="sub"></p>
    ${tx(i,'risks','ความเสี่ยงและความท้าทายหลัก','ข้อมูลหายาก, ฮาร์ดแวร์แพง, ต้องเรียนรู้เฟรมเวิร์กใหม่')}
    ${listField(i,'questions','คำถามที่ต้องนำไปปรึกษาอาจารย์','','ข้อสงสัยเรื่องขอบเขต วิธีวิจัย หรือเทคโนโลยี')}
    <label>สรุปสถานะไอเดีย</label><div class="chips">${ST.map((s,n)=>`<button data-st="${n}" class="${i.status===n?'on':''}">${s}</button>`).join('')}</div></div>
  <div class="bar"><button class="btn ghost" id="del">ลบไอเดียนี้</button><button class="btn ghost" id="dup">ทำสำเนา</button><button class="btn" id="exp">ส่งออก Markdown</button></div>`}
  $('#main').innerHTML=`<button class="btn ghost back" data-home="1">← กลับหน้าแรก</button><section>${f}</section>`;
  if(i)upd();
}
function upd(){
  const i=cur_();if(!i)return;const t=total(i),done=i.scores.every(x=>x>0);
  const tt=$('#tot'),v=$('#verdict');if(tt){tt.textContent=t+' / 20';v.textContent=!done?'ให้คะแนนให้ครบทั้ง 4 ข้อ':t>=15?'ตัวเลือกชั้นดี (15 คะแนนขึ้นไป)':'ยังไม่ถึง 15 คะแนน ลองปรับขอบเขตหรือเทียบกับไอเดียอื่น'}
  const l=$('#list');if(l)l.innerHTML=listHtml();
}
function renderCmp(){
  const s=[...ideas].sort((a,b)=>total(b)-total(a));
  $('#main').style.display='block';
  $('#main').innerHTML=s.length?`<div class="wrap"><table><thead><tr><th>อันดับ</th><th>ไอเดีย</th>${CR.map((c,n)=>`<th>${c[0]}</th>`).join('')}<th>รวม</th><th>สถานะ</th></tr></thead><tbody>${s.map((i,n)=>`<tr class="cl" data-open="${i.id}"><td>${n+1}</td><td><b>${esc(i.name)||'ยังไม่ตั้งชื่อ'}</b></td>${i.scores.map(x=>`<td>${x||'–'}</td>`).join('')}<td class="pt ${total(i)>=15?'g':''}">${total(i)}</td><td>${i.status>=0?ST[i.status]:'–'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">ยังไม่มีไอเดียให้เปรียบเทียบ</div>';
}
function renderHome(){
  $('#main').innerHTML=`<div class="hd"><h2>ไอเดียทั้งหมด (${ideas.length})</h2>${ideas.length?`<div class="bar"><label style="margin:0;display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="all" ${ideas.every(x=>sel.has(x.id))?'checked':''}> เลือกทั้งหมด</label><button class="btn ghost sm" id="delsel" ${sel.size?'':'disabled'}>ลบที่เลือก (${sel.size})</button></div>`:''}</div>`+(ideas.length?`<div class="gh">${ideas.map(i=>`<div class="cw"><input type="checkbox" class="ck" data-ck="${i.id}" ${sel.has(i.id)?'checked':''} aria-label="เลือก"><button class="it s${i.status}" data-open="${i.id}"><span><b>${esc(i.name)||'ไอเดียที่ยังไม่ตั้งชื่อ'}</b><small>${i.status>=0?ST[i.status]:'ยังไม่สรุปสถานะ'}</small><small style="display:block">${esc((i.users||'').slice(0,50))}</small></span><span class="pt ${total(i)>=15?'g':''}">${total(i)}</span></button></div>`).join('')}</div>`:'<div class="empty">ยังไม่มีไอเดีย<br>กด “+ ไอเดียใหม่” ด้านบนเพื่อเริ่มบันทึก</div>');
}
function show(v){view=v;$('#t-home').classList.toggle('on',v!=='cmp');$('#t-cmp').classList.toggle('on',v==='cmp');$('#main').style.display='';v==='home'?renderHome():v==='edit'?renderEdit():renderCmp()}
function md(i){
  const L=a=>a.filter(x=>x.trim());const n=(a,p)=>L(a).map((x,k)=>`  ${k+1}. ${x}`).join('\n')||'  1. -';
  const ck=ST.map((s,k)=>`\`[${i.status===k?'x':' '}] ${s}\``).join(' | ');
  return`# 📋 แบบฟอร์มบันทึกและคัดเลือกไอเดียโปรเจกต์จบ (Capstone Project Idea Log)

**ข้อมูลเบื้องต้น**
* **ชื่อไอเดีย / ชื่อโครงการชั่วคราว:** ${i.name}
* **ผู้เสนอไอเดีย:** ${i.proposer}
* **วันที่บันทึก:** ${i.date}

---

### 1. การวิเคราะห์ผู้ใช้และปัญหา (User-Centered Analysis)
* **กลุ่มผู้ใช้งานเป้าหมาย (Target Users / Persona):**
  * ${i.users}
* **ปัญหาหลักที่ต้องการแก้ไข (Pain Points):**
${n(i.pains)}
* **แนวทางแก้ไขด้วยซอฟต์แวร์ (Proposed Solution):**
  * ${i.solution}
* **คุณค่าที่ผู้ใช้จะได้รับ (Value Proposition):**
  * ${i.value}

---

### 2. ขอบเขตเทคนิคและการแบ่งงานทีม 2 คน (Technical & Team Scope)
* **ฟีเจอร์หลักสำหรับ MVP (Core Features for Minimum Viable Product):**
${n(i.features)}
* **เทคโนโลยีที่คาดว่าจะใช้ (Proposed Tech Stack):**
  * **Frontend:** ${i.fe}
  * **Backend & Database:** ${i.be}
  * **Tools / AI / Cloud:** ${i.tools}
* **การแบ่งบทบาทหน้าที่เบื้องต้น (2-Person Team Breakdown):**
  * **สมาชิกคนที่ 1:** ${i.m1}
  * **สมาชิกคนที่ 2:** ${i.m2}
  * **งานที่ทำร่วมกัน (Pair Work):** ${i.pair}

---

### 3. ตารางประเมินความพร้อมของไอเดีย (Idea Evaluation Grid)

| หัวข้อการประเมิน | คะแนน (1-5) | เหตุผลประกอบ / ข้อสังเกต |
| :--- | :---: | :--- |
${CR.map((c,k)=>`| **${k+1}. ${c[0]}** | ${i.scores[k]||'-'} | ${i.reasons[k].replace(/\|/g,'/')} |`).join('\n')}
| **คะแนนรวม (Total Score):** | **${total(i)}/20** | |

---

### 4. การวิเคราะห์ความเสี่ยงและเตรียมปรึกษาอาจารย์ (Risk & Action Plan)
* **ความเสี่ยงและความท้าทายหลัก (Key Risks & Challenges):**
  * ${i.risks}
* **คำถามที่ต้องนำไปปรึกษาอาจารย์ที่ปรึกษา (Questions for Advisor):**
${n(i.questions)}
* **สรุปสถานะไอเดีย:** ${ck}
`}
document.addEventListener('input',e=>{
  const i=cur_(),t=e.target;if(!i)return;
  if(t.dataset.k)i[t.dataset.k]=t.value;
  else if(t.dataset.l)i[t.dataset.l][+t.dataset.i]=t.value;
  else if(t.dataset.r)i.reasons[+t.dataset.r]=t.value;
  else return;
  save();if(t.dataset.k==='name')upd();
});
document.addEventListener('click',e=>{
  const b=e.target.closest('button,tr.cl');if(!b)return;const i=cur_(),d=b.dataset;
  if(d.home){show('home');return}
  if(d.open){cur=+d.open;show('edit');return}
  if(b.id==='delsel'){if(sel.size&&confirm('ลบ '+sel.size+' ไอเดียที่เลือกถาวร?')){ideas=ideas.filter(x=>!sel.has(x.id));sel.clear();save();renderHome()}return}
  if(!i)return;
  if(d.sc!==undefined){i.scores[+d.sc]=+d.v;save();b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));upd()}
  else if(d.st!==undefined){i.status=+d.st;save();b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));upd()}
  else if(d.add){i[d.add].push('');save();renderEdit();const r=document.querySelectorAll(`[data-l="${d.add}"]`);r[r.length-1].focus()}
  else if(d.del){if(i[d.del].length>1)i[d.del].splice(+d.i,1);else i[d.del]=[''];save();renderEdit()}
  else if(b.id==='del'){if(confirm('ลบไอเดียนี้ถาวร?')){ideas=ideas.filter(x=>x!==i);sel.clear();cur=null;save();show('home')}}
  else if(b.id==='dup'){const c=JSON.parse(JSON.stringify(i));c.id=Date.now();c.name+=' (สำเนา)';ideas.unshift(c);cur=c.id;save();renderEdit()}
  else if(b.id==='exp'){$('#md').value=md(i);$('#dlg').showModal()}
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.ck){const id=+t.dataset.ck;t.checked?sel.add(id):sel.delete(id);renderHome()}else if(t.id==='all'){sel.clear();if(t.checked)ideas.forEach(x=>sel.add(x.id));renderHome()}});
$('#new').onclick=()=>{const n=blank();ideas.unshift(n);cur=n.id;save();show('edit')};
$('#t-home').onclick=()=>show('home');$('#t-cmp').onclick=()=>show('cmp');
$('#close').onclick=()=>$('#dlg').close();
$('#copy').onclick=async()=>{const a=$('#md');a.select();try{await navigator.clipboard.writeText(a.value)}catch(e){document.execCommand('copy')}$('#copy').textContent='คัดลอกแล้ว';setTimeout(()=>$('#copy').textContent='คัดลอก',1500)};
load();cur=null;show('home');
</script>
</body>
</html>
